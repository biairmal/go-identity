name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: go-identity
      # go.mod replaces go-sdk with ../go-sdk until the authz release is tagged.
      - uses: actions/checkout@v4
        with:
          repository: biairmal/go-sdk
          path: go-sdk
      - uses: actions/setup-go@v5
        with:
          go-version-file: go-identity/go.mod
          cache-dependency-path: go-identity/go.sum
      - name: Install tools
        run: |
          go install mvdan.cc/gofumpt@latest
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0
          go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: make check
        working-directory: go-identity
        run: make check
      - name: Integration tests (Testcontainers)
        working-directory: go-identity
        run: make test-integration
