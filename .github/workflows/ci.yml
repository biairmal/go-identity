name: ci

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # Newest stable Go with check-latest: go.mod says 1.26.0, and older patch releases
          # carry standard-library vulnerabilities that govulncheck reports.
          go-version: stable
          check-latest: true
      - name: Install tools
        run: |
          go install mvdan.cc/gofumpt@latest
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0
          go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: make check
        run: make check
      - name: Integration tests (Testcontainers)
        run: make test-integration

  image:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Resolve tags and version
        id: vars
        run: |
          sha="sha-$(git rev-parse --short HEAD)"
          version="$sha"
          tags="ghcr.io/${{ github.repository }}:$sha"
          if [[ "${{ github.ref }}" == refs/heads/main ]]; then
            tags="$tags,ghcr.io/${{ github.repository }}:main"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            version="${{ github.ref_name }}"
            tags="$tags,ghcr.io/${{ github.repository }}:${{ github.ref_name }}"
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ghcr.io/${{ github.repository }}:smoke
          build-args: SERVICE_VERSION=${{ steps.vars.outputs.version }}
      # Run the built image in the VPS Compose stack before publishing it, with
      # the local .env defaults and a throwaway key (readable by the image's UID).
      - name: Smoke test
        env:
          IMAGE_TAG: smoke
        run: |
          grep -v '^SERVICE_VERSION=' .env.example > deploy/compose/.env
          echo "SUPER_ADMIN_EMAIL=admin@example.com" >> deploy/compose/.env
          echo "SUPER_ADMIN_PASSWORD=smoke-super-admin-1" >> deploy/compose/.env
          bash scripts/gen-dev-keys.sh deploy/compose/keys
          chmod a+r deploy/compose/keys/*
          docker compose -f deploy/compose/docker-compose.yaml --profile vps up -d --wait
          got="$(curl -sk --retry 10 --retry-all-errors --retry-delay 1 https://localhost/version)"
          echo "$got"
          echo "$got" | grep -q '"${{ steps.vars.outputs.version }}"'
      - name: Smoke test logs
        if: failure()
        run: docker compose -f deploy/compose/docker-compose.yaml --profile vps logs
      - if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.vars.outputs.tags }}
          build-args: SERVICE_VERSION=${{ steps.vars.outputs.version }}
