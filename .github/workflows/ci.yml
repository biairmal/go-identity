name: ci

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # Newest stable Go with check-latest: go.mod says 1.26.0, and older patch releases
          # carry standard-library vulnerabilities that govulncheck reports.
          go-version: stable
          check-latest: true
      - name: Install tools
        run: |
          go install mvdan.cc/gofumpt@latest
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0
          go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: make check
        run: make check
      - name: Integration tests (Testcontainers)
        run: make test-integration

  image:
    needs: check
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Resolve tags and version
        id: vars
        run: |
          sha="sha-$(git rev-parse --short HEAD)"
          version="$sha"
          tags="ghcr.io/${{ github.repository }}:$sha"
          if [[ "${{ github.ref }}" == refs/heads/main ]]; then
            tags="$tags,ghcr.io/${{ github.repository }}:main"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            version="${{ github.ref_name }}"
            tags="$tags,ghcr.io/${{ github.repository }}:${{ github.ref_name }}"
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.vars.outputs.tags }}
          build-args: SERVICE_VERSION=${{ steps.vars.outputs.version }}
