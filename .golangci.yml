# golangci-lint v2 configuration, copied from go-sdk plus the depguard module rule.
# See https://golangci-lint.run/docs/configuration/file/

version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: none
  enable:
    - copyloopvar
    - depguard
    - dupl
    - errcheck
    - errname
    - errorlint
    - funlen
    - gocognit
    - gocritic
    - gocyclo
    - gosec
    - govet
    - ineffassign
    - lll
    - misspell
    - nakedret
    - noctx
    - nolintlint
    - predeclared
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused
  settings:
    # A module is a future service boundary: internal/<module> may import
    # internal/platform, go-sdk and the stdlib, never another internal/<module>.
    # internal/app (wiring) and cmd are exempt.
    depguard:
      rules:
        modules:
          list-mode: lax
          files:
            - "**/internal/**/*.go"
            - "!**/internal/app/**"
            - "!**/internal/platform/**"
          allow:
            - github.com/biairmal/go-identity/internal/platform
          deny:
            - pkg: github.com/biairmal/go-identity/internal/
              desc: "modules must not import each other; declare a port and wire an adapter in internal/app"
    errcheck:
      check-type-assertions: true
      check-blank: true
      exclude-functions:
        - (io.Closer).Close
        - fmt.Fprintf
        - fmt.Fprintln
        - fmt.Printf
        - fmt.Println
        - os.Remove
        - os.RemoveAll
        - os.Setenv
        - os.Unsetenv
    gocritic:
      enabled-tags:
        - diagnostic
        - experimental
        - opinionated
        - performance
        - style
    gocyclo:
      min-complexity: 15
    dupl:
      threshold: 100
    funlen:
      lines: 100
      statements: 50
    gocognit:
      min-complexity: 25
    lll:
      line-length: 120
    misspell:
      locale: US
    nakedret:
      max-func-lines: 30
    nolintlint:
      allow-unused: false
      require-explanation: false
      require-specific: false
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - ".*\\.pb\\.go$"
      - ".*\\.gen\\.go$"
      - vendor
      - bin
    rules:
      - path: _test\.go
        linters:
          - noctx
          - errcheck
          - gosec
          - funlen
          - gocognit
          - gocyclo
      - path: cmd/
        linters:
          - errcheck
      - text: "Error return value of .((os\\.)?std(out|err)\\..*|.*Close|.*Flush|os\\.Remove(All)?|.*printf?|os\\.(Un)?Setenv). is not checked"
        linters:
          - errcheck
      - text: "exported function.*should have comment"
        linters:
          - revive
      - text: "package comment should be of the form"
        linters:
          - revive

formatters:
  enable:
    - gofumpt
    - goimports

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
