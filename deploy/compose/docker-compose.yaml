# Local development stack: Postgres only.
name: go-identity

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: identity
      POSTGRES_PASSWORD: identity
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U identity -d app"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
