# Local development (`make up`/`make down`): just Postgres, by default.
#
# VPS deploy: `docker compose --profile vps pull && docker compose --profile
# vps up -d`. `migrate` runs first each time; `api` and `worker` wait on it.
# Caddy terminates TLS. Needs IMAGE_TAG (and IMAGE if not GHCR) and a real
# .env next to this file (see .env.example at the repo root).
name: go-identity

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      IDENTITY_DB_PASSWORD: ${DB_PASSWORD:-identity}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
      - ../sql:/bootstrap:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    profiles: [vps]
    image: ${IMAGE:-ghcr.io/biairmal/go-identity}:${IMAGE_TAG:-latest}
    command: ["migrate", "up"]
    env_file: .env
    environment:
      DB_HOST: postgres
    depends_on:
      postgres:
        condition: service_healthy

  api:
    profiles: [vps]
    image: ${IMAGE:-ghcr.io/biairmal/go-identity}:${IMAGE_TAG:-latest}
    command: ["serve"]
    env_file: .env
    environment:
      DB_HOST: postgres
    volumes:
      - ./keys:/etc/identity/keys:ro
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    profiles: [vps]
    image: ${IMAGE:-ghcr.io/biairmal/go-identity}:${IMAGE_TAG:-latest}
    command: ["worker"]
    env_file: .env
    environment:
      DB_HOST: postgres
    volumes:
      - ./keys:/etc/identity/keys:ro
    depends_on:
      migrate:
        condition: service_completed_successfully

  caddy:
    profiles: [vps]
    image: caddy:2-alpine
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - api

volumes:
  pgdata:
  caddy_data:
