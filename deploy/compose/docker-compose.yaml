# Local development (`make up`/`make down`): just Postgres, by default.
#
# VPS deploy: `docker compose --profile vps pull && docker compose --profile
# vps up -d`. `migrate` runs first each time; `api` and `worker` wait on it.
# Caddy terminates TLS. Needs IMAGE_TAG (and IMAGE if not GHCR) and a real
# .env next to this file (see .env.example at the repo root).
name: go-identity

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      IDENTITY_DB_PASSWORD: ${DB_PASSWORD:-identity}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
      - ../sql:/bootstrap:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    profiles: [vps]
    image: ${IMAGE:-ghcr.io/biairmal/go-identity}:${IMAGE_TAG:-latest}
    command: ["migrate", "up"]
    env_file: .env
    environment:
      DB_HOST: postgres
    depends_on:
      postgres:
        condition: service_healthy

  api:
    profiles: [vps]
    image: ${IMAGE:-ghcr.io/biairmal/go-identity}:${IMAGE_TAG:-latest}
    command: ["serve"]
    env_file: .env
    environment:
      DB_HOST: postgres
    volumes:
      - ./keys:/etc/identity/keys:ro
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    profiles: [vps]
    image: ${IMAGE:-ghcr.io/biairmal/go-identity}:${IMAGE_TAG:-latest}
    command: ["worker"]
    env_file: .env
    environment:
      DB_HOST: postgres
    volumes:
      - ./keys:/etc/identity/keys:ro
    depends_on:
      migrate:
        condition: service_completed_successfully

  caddy:
    profiles: [vps]
    image: caddy:2-alpine
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - api

  # Daily pg_dump into the `backups` volume (TRD 3.7, TRD 13 #3). Same image as
  # `postgres` so pg_dump's version always matches the server it's dumping.
  # Runs as the `postgres` superuser so the dump captures the whole `app`
  # database (schema, roles' objects, the pgcrypto extension marker), not just
  # what the `identity` app role owns.
  backup:
    profiles: [vps]
    image: postgres:16-alpine
    environment:
      PGHOST: postgres
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: app
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-7}
    entrypoint: ["sh", "-c"]
    command:
      - |
        while true; do
          pg_dump -Fc -f "/backups/app-$(date +%Y%m%d-%H%M%S).dump"
          find /backups -name '*.dump' -mtime "+$BACKUP_KEEP_DAYS" -exec rm -f {} +
          sleep 86400
        done
    volumes:
      - backups:/backups
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  caddy_data:
  backups:
