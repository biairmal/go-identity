apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "identity.fullname" . }}
  labels:
    {{- include "identity.labels" . | nindent 4 }}
data:
  {{- range $key, $value := .Values.config }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  DRAIN_DELAY: {{ .Values.lifecycle.drainDelay | quote }}
