apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "identity.fullname" . }}-migrate-{{ .Release.Revision }}
  labels:
    {{- include "identity.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.migrate.backoffLimit }}
  template:
    metadata:
      labels:
        {{- include "identity.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      securityContext:
        {{- include "identity.podSecurityContext" . | nindent 8 }}
      containers:
        - name: migrate
          image: {{ include "identity.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["migrate", "up"]
          env:
            {{- include "identity.hookEnv" . | nindent 12 }}
          {{- if .Values.secret.existingSecret }}
          envFrom:
            {{- include "identity.hookEnvFrom" . | nindent 12 }}
          {{- end }}
          securityContext:
            {{- include "identity.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: tmp, emptyDir: {} }
