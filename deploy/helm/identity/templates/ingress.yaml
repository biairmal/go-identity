{{- if and .Values.route.enabled (eq .Values.route.kind "ingress") }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "identity.fullname" . }}
  labels:
    {{- include "identity.labels" . | nindent 4 }}
  {{- $annotations := .Values.route.annotations }}
  {{- if .Values.route.blockInternalPath }}
  {{/* nginx-ingress only: TRD 9.8/T9.2, see docs/DECISIONS.md for other controllers. */}}
  {{- $annotations = merge (dict "nginx.ingress.kubernetes.io/configuration-snippet" "if ($uri ~* \"^/v1/internal\") { return 404; }\n") $annotations }}
  {{- end }}
  {{- with $annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.route.tls.enabled }}
  tls:
    - hosts: [{{ .Values.route.host | quote }}]
      secretName: {{ .Values.route.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.route.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "identity.fullname" . }}
                port:
                  number: {{ .Values.service.port }}
{{- end }}
