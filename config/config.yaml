# Defaults for every environment. Values that differ per environment are
# written as ${ENV_VAR:default}; .env (local) or Secrets/ConfigMaps (clusters)
# feed the same keys. Secrets never live in this file.

service:
  name: ${SERVICE_NAME:go-identity}
  version: ${SERVICE_VERSION:dev}             # set by CI from the git tag
  environment: ${APP_ENV:local}               # local | staging | production

http:
  addr: ${HTTP_ADDR::8080}
  read_header_timeout: 10s
  max_body_bytes: 1048576                     # 1 MiB request limit
  trust_proxy: ${TRUST_PROXY:false}           # true only behind a proxy that sets X-Forwarded-For
  cors:
    allowed_origins: [${CORS_ORIGINS:http://localhost:3000}]

log:                                          # logger.Options
  level: ${LOG_LEVEL:info}
  format: ${LOG_FORMAT:json}                  # json | text
  output: stdout

database:                                     # sqlkit.Config
  leader:
    driver: postgres
    host: ${DB_HOST:localhost}
    port: ${DB_PORT:5432}
    database: ${DB_NAME:app}
    username: ${DB_USER:identity}
    password: ${DB_PASSWORD:identity}
    ssl_mode: ${DB_SSLMODE:disable}
    max_retries: 3
  followers: []
  pool: { max_open_conns: 25, max_idle_conns: 5, conn_max_lifetime: 5m }
  health: { enabled: true, check_interval: 10s, timeout: 2s }

auth:                                         # enabled + auth.Config
  enabled: ${AUTH_ENABLED:false}
  mode: local
  default_protected: true
  rules:
    - { pattern: /healthz, public: true }
    - { pattern: /readyz, public: true }
    - { pattern: /version, public: true }
    - { pattern: /metrics, public: true }
    - { method: GET, pattern: /.well-known/jwks.json, public: true }  # token verification keys
    - { method: GET, pattern: /v1/auth/config, public: true }   # sign-in screen settings
    - { method: POST, pattern: /v1/auth/login, public: true }
    - { method: POST, pattern: /v1/auth/register, public: true }
    - { method: POST, pattern: /v1/auth/email/verify, public: true }
    - { method: POST, pattern: /v1/auth/email/resend, public: true }
    - { method: POST, pattern: /v1/auth/refresh, public: true }      # refresh token in the body
    - { method: POST, pattern: /v1/auth/logout, public: true }
    - { method: POST, pattern: /v1/auth/logout-all, public: true }
  local:
    algorithm: RS256
    jwks_url: ${AUTH_JWKS_URL:http://localhost:8080/.well-known/jwks.json}
    issuer: ${AUTH_ISSUER:identity}
    audience: ${AUTH_AUDIENCE:api}
  cache_ttl: 30s

crypto:                                       # field encryption for stored emails (go-sdk crypto)
  encryption_key: ${EMAIL_ENCRYPTION_KEY:}    # base64, 32 bytes; required outside local
  blind_index_key: ${EMAIL_BLIND_INDEX_KEY:}  # base64, >=16 bytes, distinct from the above

tracing:                                      # enabled + tracer.Config
  enabled: ${TRACING_ENABLED:false}
  endpoint: ${OTEL_ENDPOINT:localhost:4317}
  insecure: true
  sample_rate: 1.0

metrics:                                      # enabled + path + metrics.Config
  enabled: ${METRICS_ENABLED:true}
  path: /metrics
  namespace: ${METRICS_NAMESPACE:identity}

validator:
  field_name_tag: json

lifecycle:                                    # lifecycle.Config
  drain_delay: ${DRAIN_DELAY:0s}              # 5-10s in clusters
  shutdown_timeout: 20s
  closer_timeout: 10s

redis:                                        # optional; sign-in and sign-up rate limits
  mode: standalone                            # standalone | sentinel | cluster
  address: ${REDIS_ADDR:}                     # empty = no Redis, per-pod in-memory limits
  password: ${REDIS_PASSWORD:}

# One block per module: a setting lives with the module that reads it. Only
# values that differ from the module's Default() need to appear here.
modules:
  auth:                                       # sign-in flows, tokens, /v1/auth, /v1/me
    public_url: ${IDENTITY_PUBLIC_URL:http://localhost:8080}
    frontend_urls: [${FRONTEND_URL:http://localhost:3000}]
    service_clients: []                       # [{id, secret_hash}] for /v1/internal callers

    providers:
      password:
        enabled: ${AUTH_PASSWORD_ENABLED:true}
        min_length: 10
        require_email_verification: true
        breached_password_check: false
      google:
        enabled: ${AUTH_GOOGLE_ENABLED:false}
        client_id: ${GOOGLE_CLIENT_ID:}
        client_secret: ${GOOGLE_CLIENT_SECRET:}
        allowed_domains: []
        auto_link_verified_email: true

    registration:
      enabled: ${REGISTRATION_ENABLED:true}   # false = invite-only
      default_roles: [member]

    token:                                    # access token; refresh is modules.session
      issuer: ${TOKEN_ISSUER:identity}
      audience: [${TOKEN_AUDIENCE:api}]
      access_ttl: 15m
      claims: roles                           # roles | roles_and_permissions
      signing_keys_dir: ${SIGNING_KEYS_DIR:/etc/identity/keys}

    security:
      login_rate_limit: 10/5m                 # per IP and per email
      refresh_rate_limit: 60/5m               # POST /v1/auth/refresh, per IP
      lockout_after_failures: 10
      lockout_duration: 15m

  session:                                    # refresh-token families
    refresh_ttl: 720h                         # 30 days, sliding on rotation
    refresh_absolute_ttl: 2160h               # 90 days, then sign in again
    refresh_reuse_grace: 10s                  # tolerates refreshes racing across pods

  tenant:
    mode: ${TENANCY_MODE:single}              # single | multi
    default_tenant_slug: default
    resolve_from: [token, header]             # header only on login and register
    allow_self_service_tenants: false

  user:
    super_admin:                              # first start only; forced change at first login
      email: ${SUPER_ADMIN_EMAIL:}
      password: ${SUPER_ADMIN_PASSWORD:}

  rbac:
    seed_on_start: true
    permissions:                              # catalog; services check these strings
      - { key: users:read,   description: View users }
      - { key: users:manage, description: Invite, disable and assign roles to users }
      - { key: roles:manage, description: Create and edit roles }
      - { key: audit:read,   description: View the audit log }
    roles:                                    # seeded once into each tenant
      admin:  [users:read, users:manage, roles:manage, audit:read]
      member: []
